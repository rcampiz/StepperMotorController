# The Raspberry Pi tooling without a Pi: scripts/pi/pi_setup.sh in an arm64 Debian Trixie container
# (QEMU), twice (it must be idempotent), and the PC launcher's self-test on Windows.
name: pi-setup

on:
  push:
    paths: ["scripts/pi/**", "scripts/setup/**", "client/requirements.txt", ".github/workflows/pi-setup.yml"]
  pull_request:
    paths: ["scripts/pi/**", "scripts/setup/**", "client/requirements.txt", ".github/workflows/pi-setup.yml"]
  workflow_dispatch:

jobs:
  pi-setup-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                  # git bundle needs the whole history
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: pi_setup.sh in Debian trixie arm64 (dry run, then for real twice)
        run: |
          git bundle create /tmp/smc.bundle --all
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src:ro" -v /tmp/smc.bundle:/tmp/smc.bundle:ro debian:trixie bash -ec '
              apt-get update -q >/dev/null
              apt-get install -y -q sudo git ca-certificates python3 udev >/dev/null
              useradd -m robot
              echo "robot ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/robot
              su robot -c "bash /src/scripts/pi/pi_setup.sh --dry-run --link static"
              su robot -c "bash /src/scripts/pi/pi_setup.sh --bundle /tmp/smc.bundle --link ics --no-upgrade"
              su robot -c "bash /src/scripts/pi/pi_setup.sh --bundle /tmp/smc.bundle --link ics --no-upgrade"
              test -d /home/robot/StepperMotorController/.git
              test -x /home/robot/StepperMotorController/client/.venv/bin/python
              /home/robot/StepperMotorController/client/.venv/bin/python -c "import serial, numpy, PySide6, pygame"
              test -f /home/robot/.config/smc/boards.conf
            '

  launcher-selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: robot_link.ps1 self-test (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\pi\robot_link.ps1 -Action selftest
