# Which Nucleo is which wheel, for every Pi: ROLE=ST-LINK serial. pi_setup.sh makes
# /dev/smc-ROLE from this (udev, by serial), so a new Pi names the boards on its first run.
# A Pi's own ~/.config/smc/boards.conf, if it has one, overrides a role here.
#
# A board's serial: on the Pi, `udevadm info -q property -n /dev/ttyACM0 | grep SERIAL_SHORT`
# (pi_setup.sh also lists every ST-LINK it sees). Roles: FL FR RL RR.
#
# The bench board (docs/PI_SETUP.md section 6), its wheel not assigned yet:
#   066CFF545150898367165515
#FL=
#FR=
#RL=
#RR=
