[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-client"
version = "0.6.0"                # the client release, separate from the firmware (docs/VERSIONING.md)
description = "Host client for the STM32 stepper motor controller: shared core, GUI and CLI"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
# pygame-ce: SDL2 for the PS4 / PS5 pad (USB or Bluetooth) on Windows and on the Raspberry Pi 5
# PySide6-Essentials: QtCore / QtGui / QtWidgets / QtSvg, all the GUI uses (a full PySide6 does too)
gui = ["PySide6-Essentials>=6.5", "pyqtgraph>=0.13", "numpy>=1.24", "scipy>=1.10", "Pillow>=10.0", "pygame-ce>=2.5"]
gamepad = ["pygame-ce>=2.5"]
rtt = ["pylink-square>=1.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["smc_core*", "smc_gui*", "smc_cli*"]

[tool.setuptools.package-data]
smc_core = ["motors/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
smc = "smc_cli.__main__:main"
smc-gui = "smc_gui.__main__:main"
